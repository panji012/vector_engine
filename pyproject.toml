[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "vector_engine"
version = "0.1.0"
description = "Modular high-performance vector geometry engine built with Rust and Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Vector Engine Contributors" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "maturin>=1.4",
    "mypy>=1.0",
]

[tool.maturin]
manifest-path = "crates/vector-ffi/Cargo.toml"
python-source = "python"
module-name = "vector_engine._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["vector_engine"]
